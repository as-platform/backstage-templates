apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: monorepo
  title: Monorepo with an API and a React frontend
  description: One repository with an API (Go or Python) and a React frontend, each with its own signed image in Zot and an optional deploy to the dev cluster
  tags:
    - monorepo
    - backend
    - frontend
spec:
  owner: group:default/platform
  type: service
  parameters:
    - title: Service
      required:
        - name
        - owner
        - description
      properties:
        name:
          title: Name
          type: string
          description: Becomes the repository and the prefix of the two services, namespaces, Applications and release names (name-api and name-web). Lowercase letters, digits and dashes, 3 to 28 characters. Names of platform components, namespaces and catalog systems are reserved
          pattern: '^(?!kube(-|$)|as-platform$)[a-z][a-z0-9-]{1,26}[a-z0-9]$'
          not:
            enum:
              - argocd
              - sealed-secrets
              - metallb
              - traefik
              - cert-manager
              - zot
              - keda
              - github-runner
              - monitoring
              - backstage
              - postgres
              - kyverno
              - storage
              - default
              - podinfo
              - root
              - openbao
              - tailscale
              - apps
              - infra
          ui:autofocus: true
        description:
          title: Description
          type: string
        owner:
          title: Owner
          type: string
          ui:field: OwnerPicker
          ui:options:
            allowArbitraryValues: false
            catalogFilter:
              kind: Group
        apiLanguage:
          title: API language
          type: string
          enum:
            - go
            - python
          default: go
    - title: Deploy
      properties:
        deployDev:
          title: Deploy to dev
          type: boolean
          default: true
          description: Open a pull request in as-platform/k3s and bump the image tags from CI
  steps:
    - id: fetch-api
      name: Render API skeleton
      action: fetch:template
      input:
        url: ../../skeletons/back-${{ parameters.apiLanguage }}
        targetPath: ./app/services/api
        copyWithoutTemplating:
          - uv.lock
        values:
          name: ${{ parameters.name }}-api
          repo: ${{ parameters.name }}
          system: ${{ parameters.name }}
          owner: ${{ parameters.owner }}
          description: ${{ parameters.description }}
          monorepo: true
    - id: fetch-web
      name: Render frontend skeleton
      action: fetch:template
      input:
        url: ../../skeletons/front-react
        targetPath: ./app/services/web
        copyWithoutTemplating:
          - package-lock.json
        values:
          name: ${{ parameters.name }}-web
          repo: ${{ parameters.name }}
          system: ${{ parameters.name }}
          owner: ${{ parameters.owner }}
          description: ${{ parameters.description }}
          monorepo: true
    - id: fetch-root
      name: Render repository root
      action: fetch:template
      input:
        url: ../../skeletons/monorepo
        targetPath: ./app
        values:
          name: ${{ parameters.name }}
          owner: ${{ parameters.owner }}
          description: ${{ parameters.description }}
          deployDev: ${{ parameters.deployDev }}
          apiLanguage: ${{ parameters.apiLanguage }}
    - id: publish-repo
      name: Create repository
      action: publish:github
      input:
        repoUrl: github.com?owner=as-platform&repo=${{ parameters.name }}
        description: ${{ parameters.description }}
        sourcePath: ./app
        repoVisibility: private
        defaultBranch: main
        deleteBranchOnMerge: true
        gitCommitMessage: 'feat: scaffold services from monorepo template'
        repoVariables:
          ZOT_REGISTRY: zot.homelab
    - id: runner-access
      name: Grant self-hosted runner access
      action: github:runner-group:add-repo
      input:
        repoUrl: github.com?owner=as-platform&repo=${{ parameters.name }}
        runnerGroup: Default
    - id: fetch-platform-api
      name: Render platform values of the API
      if: ${{ parameters.deployDev }}
      action: fetch:template
      input:
        url: ../../skeletons/_shared/platform-pr
        targetPath: ./platform
        values:
          name: ${{ parameters.name }}-api
          memoryLimit: "${{ '256Mi' if parameters.apiLanguage == 'python' else '' }}"
    - id: fetch-platform-web
      name: Render platform values of the frontend
      if: ${{ parameters.deployDev }}
      action: fetch:template
      input:
        url: ../../skeletons/_shared/platform-pr
        targetPath: ./platform
        values:
          name: ${{ parameters.name }}-web
    - id: platform-pr
      name: Open pull request in k3s
      if: ${{ parameters.deployDev }}
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=as-platform&repo=k3s
        sourcePath: ./platform
        targetBranchName: main
        branchName: feature/add-app-${{ parameters.name }}
        title: 'feat(apps): add ${{ parameters.name }} services'
        commitMessage: 'feat(apps): add ${{ parameters.name }} services'
        description: |
          ## Why
          New services `${{ parameters.name }}-api` and `${{ parameters.name }}-web` created from the `monorepo` template.

          ## What changed
          - `apps/${{ parameters.name }}-api/values.yaml`: image `zot.homelab/apps/${{ parameters.name }}-api`, ingress `${{ parameters.name }}-api.homelab`
          - `apps/${{ parameters.name }}-web/values.yaml`: image `zot.homelab/apps/${{ parameters.name }}-web`, ingress `${{ parameters.name }}-web.homelab`

          ## How to verify
          - The first CI run in `as-platform/${{ parameters.name }}` pushed both images to Zot
          - After the merge re-run the `deploy-api` and `deploy-web` jobs of that repository, then both Applications become `Synced` and `Healthy`

          ## Risks
          - Merge only after the first images are in Zot: the placeholder tag `bootstrap` does not exist and the Applications stay `Degraded` until the deploy jobs bump them
    - id: register
      name: Register system and components
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish-repo'].output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml
  output:
    links:
      - title: Repository
        url: ${{ steps['publish-repo'].output.remoteUrl }}
      - title: Pull request in k3s
        url: ${{ steps['platform-pr'].output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
