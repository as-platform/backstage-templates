apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: ${{ values.name }}
{%- if values.description %}
  description: ${{ values.description | dump }}
{%- endif %}
  annotations:
    github.com/project-slug: as-platform/${{ values.name }}
spec:
  owner: ${{ values.owner }}
---
apiVersion: backstage.io/v1alpha1
kind: Location
metadata:
  name: ${{ values.name }}-services
spec:
  targets:
    - ./services/api/catalog-info.yaml
    - ./services/web/catalog-info.yaml
